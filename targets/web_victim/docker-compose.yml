version: '3.8'
services:
  web_victim:
    build: .
    container_name: cybersim_web_victim
    ports:
      - "8080:8080"
    networks:
      cybersim_net:
        ipv4_address: 172.21.0.2
    restart: unless-stopped

networks:
  cybersim_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/24
