{% extends "base.html" %}
{% block title %}Upload{% endblock %}
{% block content %}
<div style="max-width:500px;margin:3rem auto;">
    <h1>File Upload</h1>
    <p style="color:#9ca3af;margin-bottom:1rem;">Upload documents, images, or receipts.</p>
    {% if result %}<div class="success">{{ result }}</div>{% endif %}
    <form method="POST" enctype="multipart/form-data">
        <label>Select File</label>
        <input type="file" name="file" required style="padding:.5rem;">
        <button type="submit" style="width:100%;margin-top:1rem;">Upload</button>
    </form>
</div>
{% endblock %}
