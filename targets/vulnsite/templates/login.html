{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div style="max-width:400px;margin:3rem auto;">
    <h1>Login</h1>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="POST">
        <label>Email</label>
        <input type="text" name="email" placeholder="admin@shopsim.com" required>
        <label>Password</label>
        <input type="password" name="password" placeholder="Enter password" required>
        <button type="submit" style="width:100%;margin-top:1rem;">Login</button>
    </form>
    <p style="margin-top:1rem;text-align:center;"><a href="/forgot-password">Forgot password?</a> | <a
            href="/register">Register</a></p>
</div>
{% endblock %}
