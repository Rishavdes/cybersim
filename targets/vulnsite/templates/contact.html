{% extends "base.html" %}
{% block title %}Contact Us{% endblock %}
{% block content %}
<div style="max-width:500px;margin:3rem auto;">
    <h1>Contact Us</h1>
    {% if result %}<div class="success">{{ result }}</div>{% endif %}
    <form method="POST">
        <label>Name</label>
        <input type="text" name="name" required>
        <label>Email</label>
        <input type="text" name="email" placeholder="your@email.com" required>
        <label>Message</label>
        <textarea name="message" rows="4" required></textarea>
        <button type="submit" style="width:100%;margin-top:1rem;">Send Message</button>
    </form>
</div>
{% endblock %}
